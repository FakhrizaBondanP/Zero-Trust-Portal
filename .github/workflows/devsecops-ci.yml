name: Phase 1 - DevSecOps Build, Scan & ECR Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # Wajib untuk AWS OIDC authentication (Zero static secrets)
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_BACKEND_REPO: zero-trust-backend
  ECR_FRONTEND_REPO: zero-trust-frontend

jobs:
  shift-left-security:
    name: 1. Dockerfile Lint, Custom SAST & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Lint Dockerfiles with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/backend/Dockerfile
          config: security/.hadolint.yaml

      - name: Lint Frontend Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/frontend/Dockerfile
          config: security/.hadolint.yaml

      - name: Run Custom SAST with Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: security/semgrep-rules.yml

      - name: Trivy Filesystem & Secret Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: security/trivy.yaml

  build-scan-sbom:
    name: 2. Container Build, CVE Scan, SBOM & AWS ECR Push
    needs: shift-left-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Backend & Frontend Images
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -t zero-trust-backend:${IMAGE_TAG} ./app/backend
          docker build -t zero-trust-frontend:${IMAGE_TAG} ./app/frontend

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'zero-trust-backend:${{ github.sha }}'
          trivy-config: security/trivy.yaml
        if: false # Diganti dengan step eksplisit di bawah agar tag 7-char terbaca

      - name: Scan Images & Generate CycloneDX SBOM
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/security/trivy.yaml":/trivy.yaml \
            aquasec/trivy:latest image --config /trivy.yaml zero-trust-backend:${IMAGE_TAG}

          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/security/trivy.yaml":/trivy.yaml \
            aquasec/trivy:latest image --config /trivy.yaml zero-trust-frontend:${IMAGE_TAG}

          # Generate Software Bill of Materials (SBOM)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --format cyclonedx zero-trust-backend:${IMAGE_TAG} > sbom-backend.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: sbom-*.json

      # Aktif otomatis jika AWS_ROLE_TO_ASSUME sudah diset di GitHub Secrets (Fase 2)
      - name: Configure AWS Credentials via OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && github.ref == 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login & Push to Amazon ECR
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && github.ref == 'refs/heads/main' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & Push Images to ECR
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && github.ref == 'refs/heads/main' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker tag zero-trust-backend:${IMAGE_TAG} $ECR_REGISTRY/$ECR_BACKEND_REPO:${IMAGE_TAG}
          docker tag zero-trust-backend:${IMAGE_TAG} $ECR_REGISTRY/$ECR_BACKEND_REPO:v1.0.0
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO --all-tags

          docker tag zero-trust-frontend:${IMAGE_TAG} $ECR_REGISTRY/$ECR_FRONTEND_REPO:${IMAGE_TAG}
          docker tag zero-trust-frontend:${IMAGE_TAG} $ECR_REGISTRY/$ECR_FRONTEND_REPO:v1.0.0
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO --all-tags
