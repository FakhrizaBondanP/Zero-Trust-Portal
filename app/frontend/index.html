<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero-Trust Internal Asset Portal</title>
  <style>
    :root { --bg: #0b1120; --card: #1e293b; --border: #334155; --text: #f8fafc; --accent: #38bdf8; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); max-width: 920px; margin: 40px auto; padding: 0 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
    .status-pill { background: #0f172a; border: 1px solid var(--accent); color: var(--accent); padding: 6px 14px; border-radius: 999px; font-size: 13px; }
    .identity-box { background: #172554; border: 1px solid #1d4ed8; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
    th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #0f172a; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .Available { background: #064e3b; color: #34d399; }
    .Assigned { background: #78350f; color: #fbbf24; }
    .Locked { background: #7f1d1d; color: #fca5a5; }
    .form-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select, button { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
    button { background: #0284c7; border: none; font-weight: 600; cursor: pointer; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 style="margin:0;">🛡️ Zero-Trust Asset Portal</h1>
      <small style="color:#94a3b8;">Cloud-Native Enterprise Inventory System</small>
    </div>
    <span class="status-pill" id="sys-health">Checking API...</span>
  </header>

  <div class="identity-box" id="identity-banner">Memverifikasi sesi identitas...</div>

  <form class="form-row" id="add-form">
    <input type="text" id="tag" placeholder="Tag (mis: AST-005)" required>
    <input type="text" id="name" placeholder="Nama Perangkat" required style="flex:1;">
    <select id="category">
      <option value="Laptop">Laptop</option>
      <option value="Security Key">Security Key</option>
      <option value="Cloud Server">Cloud Server</option>
    </select>
    <select id="classification">
      <option value="Internal">Internal</option>
      <option value="Confidential">Confidential</option>
      <option value="Restricted">Restricted</option>
    </select>
    <button type="submit">+ Tambah Aset</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Asset Tag</th>
        <th>Nama Perangkat</th>
        <th>Kategori</th>
        <th>Klasifikasi</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="asset-table">
      <tr><td colspan="5">Memuat data...</td></tr>
    </tbody>
  </table>

  <script>
    async function loadData() {
      try {
        const health = await fetch('/readyz');
        const healthJson = await health.json();
        document.getElementById('sys-health').textContent = health.ok
          ? `● Healthy (${healthJson.environment.toUpperCase()})`
          : '● Degraded';

        const res = await fetch('/api/assets');
        const data = await res.json();

        document.getElementById('identity-banner').innerHTML =
          `<strong>Identity:</strong> ${data.identity.user} &nbsp;|&nbsp; <strong>Role:</strong> ${data.identity.role}`;

        document.getElementById('asset-table').innerHTML = data.assets.map(a => `
          <tr>
            <td><code>${a.asset_tag}</code></td>
            <td><strong>${a.name}</strong></td>
            <td>${a.category}</td>
            <td>${a.classification}</td>
            <td><span class="badge ${a.status}">${a.status}</span></td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('sys-health').textContent = '● API Offline';
      }
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/assets', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          asset_tag: document.getElementById('tag').value,
          name: document.getElementById('name').value,
          category: document.getElementById('category').value,
          classification: document.getElementById('classification').value
        })
      });
      e.target.reset();
      loadData();
    });

    loadData();
  </script>
</body>
</html>
